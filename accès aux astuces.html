<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Accès aux Astuces – chez-JL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Centrage propre du titre sans la mascotte */
    .bandeau-titre {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* Mise en page nettoyée du menu */
    .bandeau-menu {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

    .btn-retour {
      min-width: auto;
      padding: 5px 15px;
    }

    .selecteur-langue label {
      color: white;
      font-weight: bold;
      margin-right: 8px;
    }

    .selecteur-langue select {
      padding: 5px;
      border-radius: 5px;
    }

    .btn-recherche {
      margin-top: 20px;
      width: 100%;
    }

    /* Styles de la zone de résultats */
    .zone-resultats {
      margin-top: 30px;
    }

    .message-vide {
      text-align: center;
      color: #666;
    }

    .carte-astuce {
      background: #f9f9f9;
      padding: 15px;
      border-left: 5px solid #6f6f6f;
      margin-bottom: 15px;
      border-radius: 4px;
    }

    .carte-astuce.bricolage { border-left-color: #c9a36a; }
    .carte-astuce.mecanique { border-left-color: #6f6f6f; }
    .carte-astuce.maison { border-left-color: #4a90e2; }
    .carte-astuce.electricite { border-left-color: #f5a623; }
    .carte-astuce.jardinage { border-left-color: #7ed321; }

    .carte-astuce a {
      color: #0056b3;
      text-decoration: underline;
    }

    .btn-musique {
      background: none;
      border: none;
      cursor: pointer;
      margin-left: 15px;
      color: inherit;
      font-family: inherit;
    }
  </style>
</head>
<body class="page-acces-astuces">

  <!-- Musique d'ambiance fonctionnelle (lien MP3 direct libre de droits) -->
  <audio loop id="audio-ambiance" preload="none">
    <source src="https://soundhelix.com" type="audio/mpeg">
    Votre navigateur ne supporte pas l'élément audio.
  </audio>

  <header class="header-accueil">
    <div class="bandeau-titre">
      <div class="header-texte">
        <h1>chez-JL</h1>
        <p id="txt-sous-titre">Espace Consultation des Astuces</p>
      </div>
    </div>

    <!-- Sélecteur de Langue & Retour -->
    <div class="bandeau-menu">
      <a href="index.html" class="btn btn-retour" id="txt-retour">⬅ Accueil</a>
      
      <div class="selecteur-langue">
        <label for="langue" id="txt-label-langue">🌐 Langue :</label>
        <select id="langue" onchange="changerLangue(this.value)">
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="ar">العربية (Arabe)</option>
          <option value="yi">ייִדיש (Yiddish)</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <!-- Nomenclature / Filtres de recherche -->
    <section class="section-filtres">
      <h2 id="txt-titre-filtre">🔍 Quelle astuce vous intéresse ?</h2>
      <form id="form-filtres">
        
        <!-- Catégories d'astuces -->
        <h3 id="txt-par-cat">Par Catégorie :</h3>
        <div class="group-filtres">
          <label><input type="checkbox" name="categorie" value="bricolage" onchange="filtrerAstuces()"> <span id="lbl-cat-bricolage">Bricolage</span></label>
          <label><input type="checkbox" name="categorie" value="mecanique" onchange="filtrerAstuces()"> <span id="lbl-cat-mecanique">Mécanique</span></label>
          <label><input type="checkbox" name="categorie" value="maison" onchange="filtrerAstuces()"> <span id="lbl-cat-maison">Maison & Quotidien</span></label>
          <label><input type="checkbox" name="categorie" value="electricite" onchange="filtrerAstuces()"> <span id="lbl-cat-electricite">Électricité</span></label>
          <label><input type="checkbox" name="categorie" value="jardinage" onchange="filtrerAstuces()"> <span id="lbl-cat-jardinage">Jardin</span></label>
        </div>

        <!-- Types de contenus demandés -->
        <h3 id="txt-par-media">Par type de média :</h3>
        <div class="group-filtres">
          <label><input type="checkbox" name="media" value="texte" onchange="filtrerAstuces()"> <span id="lbl-med-texte">📝 Astuces Textes</span></label>
          <label><input type="checkbox" name="media" value="image" onchange="filtrerAstuces()"> <span id="lbl-med-image">🖼️ Images envoyées</span></label>
          <label><input type="checkbox" name="media" value="video" onchange="filtrerAstuces()"> <span id="lbl-med-video">🎬 Vidéos</span></label>
          <label><input type="checkbox" name="media" value="message" onchange="filtrerAstuces()"> <span id="lbl-med-message">💬 Messages des internautes</span></label>
        </div>

        <button type="button" class="btn btn-recherche" id="txt-btn-recherche" onclick="filtrerAstuces()">Rechercher les contributions</button>
      </form>
    </section>

    <!-- Zone d'affichage des résultats -->
    <section class="zone-resultats">
      <h2 id="txt-titre-resultats">📋 Dernières contributions reçues</h2>
      <div id="liste-astuces-flux"></div>
    </section>
  </main>

  <footer>
    <span id="txt-footer">© chez-JL – Tous droits réservés</span>
    <button id="btn-musique" class="btn-musique" onclick="toggleAudio()">🎵 Activer la musique</button>
  </footer>
